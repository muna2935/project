<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1a103d, #3d176b, #711c73);
    color: white;
}

/* ---------------- INTRO SCREEN ---------------- */

#intro {
    position: fixed;
    inset: 0;
    background: #0d0920;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1000;
    text-align: center;
    transition: opacity 1s ease;
}

.terminal {
    font-family: monospace;
    font-size: 18px;
    color: #b9a7ff;
    line-height: 2;
    padding: 20px;
}

.loading {
    width: 280px;
    height: 8px;
    border-radius: 20px;
    background: #2d2648;
    margin-top: 20px;
    overflow: hidden;
}

.loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff5ec4, #8c7bff);
    animation: loading 3s forwards;
}

@keyframes loading {
    to {
        width: 100%;
    }
}

/* ---------------- MAIN ---------------- */

#main {
    min-height: 100vh;
    display: none;
    position: relative;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.card {
    width: min(90%, 650px);
    padding: 40px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    z-index: 10;
}

.small-title {
    font-size: 18px;
    color: #ffd8f5;
    letter-spacing: 2px;
}

h1 {
    font-size: clamp(40px, 9vw, 72px);
    margin: 10px 0;
    background: linear-gradient(90deg, #fff, #ffb5e8, #c7b8ff);
    -webkit-background-clip: text;
    color: transparent;
}

.name {
    font-size: clamp(28px, 6vw, 45px);
    color: #ffe0f5;
    margin-bottom: 20px;
}

.message {
    font-size: 18px;
    line-height: 1.8;
    color: #f8ecff;
    min-height: 90px;
}
.cake {
    position: relative;
    width: 170px;
    height: 120px;
    margin: 30px auto 25px;
}

.layer {
    position: absolute;
    left: 10px;
    width: 150px;
    height: 45px;
    border-radius: 12px;
    background: linear-gradient(#ff8ac8, #e84e9f);
    box-shadow: inset 0 -8px rgba(0,0,0,0.12);
}

.layer.one {
    bottom: 0;
}

.layer.two {
    bottom: 38px;
    width: 130px;
    left: 20px;
}

.layer.three {
    bottom: 76px;
    width: 105px;
    left: 32px;
}

.icing {
    position: absolute;
    top: 76px;
    left: 32px;
    width: 105px;
    height: 15px;
    background: #fff2fa;
    border-radius: 10px;
}

.candle {
    position: absolute;
    width: 12px;
    height: 40px;
    background: #a98cff;
    top: 38px;
    border-radius: 5px;
}

.candle:nth-child(5) {
    left: 48px;
}

.candle:nth-child(6) {
    left: 78px;
}

.candle:nth-child(7) {
    left: 108px;
}

.flame {
    position: absolute;
    width: 15px;
    height: 22px;
    background: #ffd34d;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    top: 18px;
    left: -2px;
    animation: flame 0.5s infinite alternate;
}

@keyframes flame {
    from {
        transform: rotate(-45deg) scale(1);
    }
    to {
        transform: rotate(-45deg) scale(1.15);
    }
}

button {
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #32113c;
    background: linear-gradient(135deg, #ffd1ef, #cfc3ff);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px) scale(1.03);
}

#wishMessage {
    margin-top: 20px;
    font-size: 20px;
    color: #ffe2f6;
    display: none;
}
.balloon {
    position: absolute;
    bottom: -150px;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    opacity: 0.8;
    animation: floatUp linear infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 100px;
    background: rgba(255,255,255,0.5);
    left: 50%;
    top: 68px;
}

.balloon1 {
    left: 8%;
    background: #ff70b7;
    animation-duration: 10s;
}

.balloon2 {
    left: 25%;
    background: #8f83ff;
    animation-duration: 13s;
    animation-delay: 2s;
}

.balloon3 {
    right: 20%;
    background: #ffd35e;
    animation-duration: 11s;
    animation-delay: 4s;
}

.balloon4 {
    right: 7%;
    background: #69e6d0;
    animation-duration: 14s;
    animation-delay: 1s;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
    }
    to {
        transform: translateY(-120vh) rotate(15deg);
    }
}

.confetti {
    position: fixed;
    width: 9px;
    height: 15px;
    top: -20px;
    z-index: 50;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #d9c8e8;
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 500px) {
    .card {
        padding: 30px 18px;
    }

    .message {
        font-size: 16px;
    }

    .cake {
        transform: scale(0.9);
    }
}
</style>
</head>

<body>
<h2>Happy Birthday! 🎂</h2>
<!-- INTRO -->

<section id="intro">

    <div class="terminal">
        <div id="typing"></div>
        <div class="loading">
            <div class="loading-bar"></div>
        </div>
    </div>

</section>
<section id="main">

    <div class="balloon balloon1"></div>
    <div class="balloon balloon2"></div>
    <div class="balloon balloon3"></div>
    <div class="balloon balloon4"></div>


    <div class="card">

        <div class="small-title">
            ✨ A SPECIAL MESSAGE FOR YOU ✨
        </div>

        <h1>Happy Birthday!</h1>

        <!-- CHANGE THE NAME HERE -->

        <div class="name">
            🎀 Sunil 🎀
        </div>


        <!-- Cake -->

        <div class="cake">

            <div class="layer one"></div>
            <div class="layer two"></div>
            <div class="layer three"></div>

            <div class="icing"></div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>


        <!-- Message -->

        <div class="message" id="message"></div>


        <button onclick="makeWish()">
            🎁  💙 Happy Birthday, ......! 🎂<br>
            May your smile always stay bright
            and yours dreams come true. ✨<br>
            Enjoy your special day! 🎉💙
        </button>

        <div id="wishMessage">
            🌟 🎉 Surprise! I hope this little birthday website made your day special. 💙 🌟
        </div>


        <div class="footer">
            Made with 💖 and a little bit of code
        </div>

    </div>

</section>


<script>

const introText =
"Initializing birthday surprise...<br>" +
"Loading happiness...<br>" +
"Preparing something special...<br>" +
"Surprise unlocked! 🎁";

let index = 0;
let typingElement = document.getElementById("typing");

function typeIntro() {

    if (index < introText.length) {

        typingElement.innerHTML =
            introText.substring(0, index + 1);

        index++;

        setTimeout(typeIntro, 25);

    }

}

typeIntro();
setTimeout(() => {

    const intro = document.getElementById("intro");
    const main = document.getElementById("main");

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";
        main.style.display = "flex";

        typeMessage();

    }, 1000);

}, 3500);
const birthdayMessage =
"Today is all about celebrating YOU! 🎉 " +
"May your birthday be filled with happiness, laughter, " +
"beautiful memories, and many wonderful moments. " +
"Keep smiling, keep dreaming, and keep being amazing. " +
"May this new year of your life bring you lots of joy and success! 💖";


let messageIndex = 0;
const messageElement = document.getElementById("message");

function typeMessage() {

    if (messageIndex < birthdayMessage.length) {

        messageElement.innerHTML +=
            birthdayMessage.charAt(messageIndex);

        messageIndex++;

        setTimeout(typeMessage, 35);

    }

}
function makeWish() {

    document.getElementById("wishMessage").style.display = "block";

    createConfetti();

}

function createConfetti() {

    for (let i = 0; i < 100; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.animationDuration =
            (Math.random() * 2 + 2) + "s";

        confetti.style.animationDelay =
            Math.random() * 0.5 + "s";

        confetti.style.transform =
            `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);


        setTimeout(() => {

            confetti.remove();

        }, 4000);

    }

}

</script>

</body>
</html>
